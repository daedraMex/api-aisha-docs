info:
  name: Set assignment activo - PATCH /alert-config/recipients/{recipient_id}/
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/{{recipient_id}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "activo": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - updated
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/11111111-1111-1111-1111-111111111111/"
      method: PATCH
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "activo": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "recipient_id": "11111111-1111-1111-1111-111111111111",
            "name": "Victor",
            "email": "victor@x.com",
            "activo": false
          }
  - name: 400 Bad Request - missing activo
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/11111111-1111-1111-1111-111111111111/"
      method: PATCH
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ALERT_ASSIGNMENT.VALIDATION_ERROR",
              "message": "Invalid request data.",
              "details": {
                "activo": ["This field is required."]
              }
            }
          }
  - name: 404 Not Found - not assigned
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/11111111-1111-1111-1111-111111111111/"
      method: PATCH
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "activo": true
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ALERT_ASSIGNMENT.NOT_FOUND",
              "message": "Recipient is not assigned to the alert.",
              "details": null
            }
          }

docs: "Setea el flag activo de la asignación (no togglea: usa el booleano del body)."
