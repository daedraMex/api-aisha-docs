info:
  name: List assigned recipients - GET /alert-config/recipients/
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - with data
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "recipient_id": "22222222-2222-2222-2222-222222222222",
                "name": "Ana",
                "email": "ana@x.com",
                "activo": true
              },
              {
                "recipient_id": "11111111-1111-1111-1111-111111111111",
                "name": "Victor",
                "email": "victor@x.com",
                "activo": false
              }
            ]
          }
  - name: 200 OK - empty
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": []
          }
  - name: 404 Not Found - config not seeded
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ALERT_CONFIG.NOT_FOUND",
              "message": "Alert config is not initialized. Run bootstrap_default_alert.",
              "details": null
            }
          }

docs: Destinatarios suscritos a la alerta singleton, ordenados newest-first. Envelope {data:[...]}.
