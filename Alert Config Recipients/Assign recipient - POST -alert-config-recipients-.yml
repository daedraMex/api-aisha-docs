info:
  name: Assign recipient - POST /alert-config/recipients/
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/alert-config/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "recipient_id": "{{recipient_id}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Created - new assignment
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "recipient_id": "11111111-1111-1111-1111-111111111111"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "recipient_id": "11111111-1111-1111-1111-111111111111",
            "name": "Victor",
            "email": "victor@x.com",
            "activo": true
          }
  - name: 200 OK - already assigned (idempotent)
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "recipient_id": "11111111-1111-1111-1111-111111111111"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "recipient_id": "11111111-1111-1111-1111-111111111111",
            "name": "Victor",
            "email": "victor@x.com",
            "activo": false
          }
  - name: 400 Bad Request - missing recipient_id
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ALERT_ASSIGNMENT.VALIDATION_ERROR",
              "message": "Invalid request data.",
              "details": {
                "recipient_id": ["This field is required."]
              }
            }
          }
  - name: 404 Not Found - recipient not in library
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "recipient_id": "99999999-9999-9999-9999-999999999999"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ALERT_RECIPIENT.NOT_FOUND",
              "message": "Alert recipient not found.",
              "details": null
            }
          }
  - name: 404 Not Found - config not seeded
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/recipients/"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "recipient_id": "11111111-1111-1111-1111-111111111111"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ALERT_CONFIG.NOT_FOUND",
              "message": "Alert config is not initialized. Run bootstrap_default_alert.",
              "details": null
            }
          }

docs: "Suscribe un destinatario de la libreta (alert-recipients) a la alerta singleton. Idempotente: si ya estaba asignado devuelve 200 con la asignación existente sin modificar; si es nueva devuelve 201."
