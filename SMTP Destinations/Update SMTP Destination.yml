info:
  name: Update SMTP Destination
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/smtp-destinations/{{destination_id}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "requires_authentication": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK
    request:
      url: ""
      method: PATCH
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "c7d8e9f0-1a2b-4c3d-8e9f-0a1b2c3d4e5f",
            "user_id": "3f2e9b1a-6c4d-4a2f-9e21-7d8b5c1a9f30",
            "name": "Alertas de Errores Criticos",
            "smtp_host": "smtp.gmail.com",
            "smtp_port": 587,
            "requires_authentication": true,
            "smtp_username": "alerts@aisha-health.com",
            "smtp_password": "SuperSecret123!",
            "recipients": ["ops-team@aisha-health.com", "oncall@aisha-health.com"],
            "sender_email": "no-reply@aisha-health.com",
            "subject": "[ALERTA] Fallo critico en integracion"
          }
  - name: "Error - 400 Bad Request (boundary case: auth enabled, no stored credentials)"
    request:
      url: ""
      method: PATCH
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "SMTP_DESTINATION.AUTH_CREDENTIALS_REQUIRED",
              "message": "smtp_username and smtp_password are required when requires_authentication is True.",
              "details": null
            }
          }
  - name: Error - 404 Not Found
    request:
      url: ""
      method: PATCH
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "SMTP_DESTINATION.NOT_FOUND",
              "message": "SMTP destination not found.",
              "details": null
            }
          }

docs: "PUT and PATCH behave identically: partial merge against the stored record (not full replace). Any field omitted keeps its current value. The example body intentionally flips requires_authentication to true without resending credentials, to hit the 400 boundary case below."
