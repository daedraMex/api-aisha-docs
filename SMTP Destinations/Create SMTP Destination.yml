info:
  name: Create SMTP Destination
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/smtp-destinations/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Alertas de Errores Criticos",
        "smtp_host": "smtp.gmail.com",
        "smtp_port": 587,
        "requires_authentication": true,
        "smtp_username": "alerts@aisha-health.com",
        "smtp_password": "SuperSecret123!",
        "recipients": ["ops-team@aisha-health.com", "oncall@aisha-health.com"],
        "sender_email": "no-reply@aisha-health.com",
        "subject": "[ALERTA] Fallo critico en integracion"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 201 Created
    request:
      url: ""
      method: POST
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "c7d8e9f0-1a2b-4c3d-8e9f-0a1b2c3d4e5f",
            "user_id": "3f2e9b1a-6c4d-4a2f-9e21-7d8b5c1a9f30",
            "name": "Alertas de Errores Criticos",
            "smtp_host": "smtp.gmail.com",
            "smtp_port": 587,
            "requires_authentication": true,
            "smtp_username": "alerts@aisha-health.com",
            "smtp_password": "SuperSecret123!",
            "recipients": ["ops-team@aisha-health.com", "oncall@aisha-health.com"],
            "sender_email": "no-reply@aisha-health.com",
            "subject": "[ALERTA] Fallo critico en integracion"
          }
  - name: "Error - 400 Bad Request (boundary case: port + empty recipients)"
    request:
      url: ""
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "SMTP_DESTINATION.VALIDATION_ERROR",
              "message": "Invalid request data.",
              "details": {
                "smtp_port": ["Ensure this value is less than or equal to 65535."],
                "recipients": ["This list may not be empty."]
              }
            }
          }
  - name: Error - 409 Conflict (duplicate name for user)
    request:
      url: ""
      method: POST
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "SMTP_DESTINATION.DUPLICATE_NAME",
              "message": "You already have an SMTP destination with that name.",
              "details": null
            }
          }

docs: recipients requires at least 1 valid email; smtp_port must be 1-65535; smtp_username/smtp_password are required when requires_authentication=true; (user_id, name) must be unique.
