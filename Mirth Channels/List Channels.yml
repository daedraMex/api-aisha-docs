info:
  name: List Channels
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/channels/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 1,
            "data": [
              {
                "channel_id": "07fc0b36-e4f9-4923-abed-f3bb4b9c1082",
                "name": "HL7-Ingest-Sede-Norte",
                "enabled": true,
                "status": "STARTED",
                "description": "Canal de ingesta HL7 para Sede Norte",
                "last_modified": "2026-06-20T14:02:11Z",
                "source": { "transport": "TCP Listener", "properties_class": "com.mirth.connect.connectors.tcp.TcpReceiverProperties" },
                "destinations": [
                  { "metadata_id": 1, "name": "Write to DB", "transport": "Database Writer", "properties_class": "com.mirth.connect.connectors.jdbc.DatabaseDispatcherProperties" }
                ]
              }
            ]
          }
  - name: Error - 503 Service Unavailable
    request:
      url: ""
      method: GET
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "MIRTH.UNAVAILABLE",
              "message": "Could not reach Mirth Connect through the VPN.",
              "details": null
            }
          }

docs: Returns all channels configured in Mirth. Cached 60s, stale fallback 600s.
