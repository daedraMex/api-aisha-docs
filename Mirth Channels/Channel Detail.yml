info:
  name: Channel Detail
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/channels/{{channel_id}}/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "channel_id": "07fc0b36-e4f9-4923-abed-f3bb4b9c1082",
            "name": "HL7-Ingest-Sede-Norte",
            "source_connector": { "transport": "TCP Listener", "properties_class": "com.mirth.connect.connectors.tcp.TcpReceiverProperties" },
            "destination_connectors": [
              { "metadata_id": 1, "name": "Write to DB", "transport": "Database Writer", "properties_class": "com.mirth.connect.connectors.jdbc.DatabaseDispatcherProperties" }
            ],
            "metadata_columns": [
              { "metadata_id": 1, "name": "PATIENT_ID", "type": "STRING" }
            ]
          }
  - name: Error - 404 Not Found
    request:
      url: ""
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "The specified channel does not exist in Mirth."
          }

docs: "Full configuration of a single channel: source connector, destinations and metadata columns."
