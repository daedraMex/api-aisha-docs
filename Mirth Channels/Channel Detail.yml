info:
  name: Channel Detail
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/channels/{{channel_id}}/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK
    request:
      url: "{{base_url}}/api/v1/integration-engine/channels/{{channel_id}}/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "channel_id": "704cac88-ea6b-4829-9855-8b84ca8c83b2",
            "name": "API_WORKLIST",
            "source_connector": {
              "transport": "HTTP Listener",
              "properties_class": "com.mirth.connect.connectors.http.HttpReceiverProperties"
            },
            "destination_connectors": [
              {
                "metadata_id": "1",
                "name": "CREATE",
                "transport": "Channel Writer",
                "properties_class": "com.mirth.connect.connectors.vm.VmDispatcherProperties"
              },
              {
                "metadata_id": "4",
                "name": "UPDATE",
                "transport": "Channel Writer",
                "properties_class": "com.mirth.connect.connectors.vm.VmDispatcherProperties"
              },
              {
                "metadata_id": "7",
                "name": "CANCEL",
                "transport": "Channel Writer",
                "properties_class": "com.mirth.connect.connectors.vm.VmDispatcherProperties"
              },
              {
                "metadata_id": "5",
                "name": "Destination 1",
                "transport": "TCP Sender",
                "properties_class": "com.mirth.connect.connectors.tcp.TcpDispatcherProperties"
              }
            ],
            "metadata_columns": [
              {
                "metadata_id": "SOURCE",
                "name": "mirth_source",
                "type": "STRING"
              },
              {
                "metadata_id": "TYPE",
                "name": "mirth_type",
                "type": "STRING"
              }
            ]
          }
  - name: Error - 404 Not Found
    request:
      url: "{{base_url}}/api/v1/integration-engine/channels/{{channel_id}}/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "The specified channel does not exist in Mirth."
          }

docs: "Full configuration of a single channel: source connector, destinations and metadata columns."
