info:
  name: Channel Status (all)
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/channels/status/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK
    request:
      url: "{{base_url}}/api/v1/integration-engine/channels/status/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "channel_id": "07fc0b36-e4f9-4923-abed-f3bb4b9c1082",
              "name": "HL7-Ingest-Sede-Norte",
              "status": "STARTED"
            }
          ]
  - name: Error - 503 Service Unavailable
    request:
      url: "{{base_url}}/api/v1/integration-engine/channels/status/"
      method: GET
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "MIRTH.UNAVAILABLE",
              "message": "Could not reach Mirth Connect through the VPN.",
              "details": null
            }
          }

docs: Lightweight status list for all channels.
