info:
  name: Channel Messages
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/channels/{{channel_id}}/messages/"
  params:
    - name: status
      value: ERROR
      type: query
      disabled: true
    - name: start_date
      value: 2026-01-01T00:00:00Z
      type: query
      disabled: true
    - name: end_date
      value: 2026-12-31T23:59:59Z
      type: query
      disabled: true
    - name: meta_data_search
      value: "12345"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

