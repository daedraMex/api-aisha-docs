info:
  name: Channel Statistics
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/channels/statistics/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

