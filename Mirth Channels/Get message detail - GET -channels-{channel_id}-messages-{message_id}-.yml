info:
  name: Get message detail - GET /channels/{channel_id}/messages/{message_id}/
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/channels/{{channel_id}}/messages/{{message_id}}/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - message found
    request:
      url: "{{base_url}}/api/v1/integration-engine/channels/{{channel_id}}/messages/{{message_id}}/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message_id": 128,
            "channel_id": "2df22637-35e3-47cd-942a-8328aacb12cb",
            "status": "SENT",
            "received_date": "2026-05-08T12:00:00+00:00",
            "send_date": "2026-05-08T12:00:01+00:00",
            "response_date": "2026-05-08T12:00:02+00:00",
            "metadata": {
              "MRN": "12345"
            }
          }
  - name: 404 Not Found - channel does not exist
    request:
      url: "{{base_url}}/api/v1/integration-engine/channels/does-not-exist/messages/{{message_id}}/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "The specified channel or message does not exist in Mirth."
          }
  - name: 404 Not Found - message does not exist
    request:
      url: "{{base_url}}/api/v1/integration-engine/channels/{{channel_id}}/messages/999999999/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "The specified channel or message does not exist in Mirth."
          }
  - name: 503 Service Unavailable - Mirth down
    request:
      url: "{{base_url}}/api/v1/integration-engine/channels/{{channel_id}}/messages/{{message_id}}/"
      method: GET
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "MIRTH.UNAVAILABLE",
              "message": "Mirth service is unavailable.",
              "details": null
            }
          }

docs: "Path params: channel_id (Mirth channel UUID), message_id (Mirth message id)."
