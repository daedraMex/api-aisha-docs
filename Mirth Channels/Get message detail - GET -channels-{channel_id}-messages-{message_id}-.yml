  - name: 404 Not Found - channel does not exist
    request:
      url: "{{base_url}}/api/v1/integration-engine/channels/does-not-exist/messages/{{message_id}}/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "The specified channel or message does not exist in Mirth."
          }
  - name: 404 Not Found - message does not exist
    request:
      url: "{{base_url}}/api/v1/integration-engine/channels/{{channel_id}}/messages/999999999/"
      method: GET
    response:
