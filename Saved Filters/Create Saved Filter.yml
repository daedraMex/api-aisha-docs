info:
  name: Create Saved Filter
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/{{feature}}/filters/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Canales con error",
        "filters": {
          "status": "ERROR"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 201 Created
    request:
      url: ""
      method: POST
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "b6e1c8a2-9f3d-4e7a-8c1b-2d5f6a7b8c9d",
            "user_id": "3f2e9b1a-6c4d-4a2f-9e21-7d8b5c1a9f30",
            "feature": "canales",
            "name": "Canales con error",
            "filters": { "status": "ERROR" },
            "created_at": "2026-07-07T18:30:00Z"
          }
  - name: Error - 400 Bad Request
    request:
      url: ""
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": ["This field is required."],
            "filters": ["This field is required."]
          }

docs: Max 5 saved filters per user per feature (returns 409 past the limit).
