info:
  name: Update Saved Filter
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/{{feature}}/filters/{{filter_id}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Canales con error (actualizado)"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK
    request:
      url: ""
      method: PATCH
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "b6e1c8a2-9f3d-4e7a-8c1b-2d5f6a7b8c9d",
            "user_id": "3f2e9b1a-6c4d-4a2f-9e21-7d8b5c1a9f30",
            "feature": "canales",
            "name": "Canales con error (actualizado)",
            "filters": { "status": "ERROR" },
            "created_at": "2026-06-15T09:00:00Z"
          }
  - name: Error - 404 Not Found
    request:
      url: ""
      method: PATCH
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "FILTER.NOT_FOUND",
              "message": "Filtro no encontrado",
              "details": null
            }
          }

docs: "`name` and `filters` are both optional (partial update)."
