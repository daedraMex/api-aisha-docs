info:
  name: Delete Saved Filter
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/{{feature}}/filters/{{filter_id}}/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 204 No Content
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/{{feature}}/filters/{{filter_id}}/"
      method: DELETE
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: Error - 404 Not Found
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/{{feature}}/filters/{{filter_id}}/"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "FILTER.NOT_FOUND",
              "message": "Filtro no encontrado",
              "details": null
            }
          }
