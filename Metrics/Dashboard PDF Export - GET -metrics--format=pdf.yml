info:
  name: Dashboard PDF Export - GET /metrics/?format=pdf
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/metrics/?time_frame=1w&metric=volume&format=pdf"
  params:
    - name: time_frame
      value: 1w
      type: query
    - name: metric
      value: volume
      type: query
    - name: format
      value: pdf
      type: query
    - name: channels
      value: ""
      type: query
      disabled: true
    - name: start_date
      value: ""
      type: query
      disabled: true
    - name: end_date
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - PDF (default time_frame=1w, metric=volume)
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/?time_frame=1w&metric=volume&format=pdf"
      method: GET
      params:
        - name: time_frame
          value: 1w
          type: query
        - name: metric
          value: volume
          type: query
        - name: format
          value: pdf
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/pdf
        - name: Content-Disposition
          value: attachment; filename="dashboard_metrics.pdf"
      body:
        type: text
        data: (binary PDF — title "Reporte de Metricas", period range, line chart image for mainChart, paginated channelComparisonTable. Not shown as text in this collection; use 'Send and Download' in Postman to inspect the actual file.)
  - name: 400 Bad Request - PDF (invalid metric, same validation as JSON path)
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/?metric=filtered&format=pdf"
      method: GET
      params:
        - name: metric
          value: filtered
          type: query
        - name: format
          value: pdf
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/pdf
      body:
        type: text
        data: (binary PDF — one-page 'Error' report with the validation error detail as body text.)

docs: "Same payload as 'Dashboard - GET /metrics/', selected via DRF content negotiation (?format=pdf or Accept: application/pdf). Returns a downloadable printable report (Content-Disposition: attachment): a line chart for mainChart (built with matplotlib, headless) + a paginated table for channelComparisonTable (reportlab). Channel names are XML-escaped against reportlab markup injection. 4xx/5xx responses also negotiate to PDF and degrade to a minimal 'Error' page instead of JSON. Binary response — use Postman's 'Send and Download' to save it as a .pdf file."
