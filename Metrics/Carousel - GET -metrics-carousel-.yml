info:
  name: Carousel - GET /metrics/carousel/
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/metrics/carousel/?time_frame=1w"
  params:
    - name: time_frame
      value: 1w
      type: query
    - name: channels
      value: ""
      type: query
      disabled: true
    - name: start_date
      value: ""
      type: query
      disabled: true
    - name: end_date
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - default (time_frame=1w)
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/carousel/?time_frame=1w"
      method: GET
      params:
        - name: time_frame
          value: 1w
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "volume",
              "title": "metrics.volume",
              "currentPeriodValue": 10,
              "trendPercentage": 5.0,
              "trendDirection": "up"
            },
            {
              "id": "error",
              "title": "metrics.error",
              "currentPeriodValue": 1,
              "trendPercentage": -1.0,
              "trendDirection": "down"
            },
            {
              "id": "queued",
              "title": "metrics.queued",
              "currentPeriodValue": 0,
              "trendPercentage": 0,
              "trendDirection": "up"
            },
            {
              "id": "sent",
              "title": "metrics.sent",
              "currentPeriodValue": 8,
              "trendPercentage": 2.0,
              "trendDirection": "up"
            }
          ]
  - name: 400 Bad Request - invalid time_frame
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/carousel/?time_frame=bogus"
      method: GET
      params:
        - name: time_frame
          value: bogus
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "time_frame": [
              "\"bogus\" is not a valid choice."
            ]
          }

docs: "Fixed 4 KPI summary cards, always in order: volume, error, queued, sent."
