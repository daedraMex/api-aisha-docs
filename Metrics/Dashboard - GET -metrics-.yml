info:
  name: Dashboard - GET /metrics/
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/metrics/?time_frame=1w&metric=volume"
  params:
    - name: time_frame
      value: 1w
      type: query
    - name: metric
      value: volume
      type: query
    - name: channels
      value: ""
      type: query
      disabled: true
    - name: start_date
      value: ""
      type: query
      disabled: true
    - name: end_date
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - default (time_frame=1w, metric=volume)
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/?time_frame=1w&metric=volume"
      method: GET
      params:
        - name: time_frame
          value: 1w
          type: query
        - name: metric
          value: volume
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "mainChart": {
              "labels": [
                "2026-07-14T00:00:00+00:00",
                "2026-07-15T00:00:00+00:00"
              ],
              "datasets": [
                {
                  "label": "Volumen Total",
                  "data": [120, 98]
                }
              ]
            },
            "channelComparisonTable": [
              {
                "channelId": "11111111-1111-1111-1111-111111111111",
                "name": "Channel One",
                "totalMessages": 218,
                "errorPercentage": 4.6
              }
            ]
          }
  - name: 200 OK - custom range, metric=sent
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/?time_frame=custom&metric=sent&start_date=2026-07-01T00:00:00Z&end_date=2026-07-15T00:00:00Z"
      method: GET
      params:
        - name: time_frame
          value: custom
          type: query
        - name: metric
          value: sent
          type: query
        - name: start_date
          value: 2026-07-01T00:00:00Z
          type: query
        - name: end_date
          value: 2026-07-15T00:00:00Z
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "mainChart": {
              "labels": [
                "2026-07-01T00:00:00+00:00"
              ],
              "datasets": [
                {
                  "label": "Enviados",
                  "data": [7]
                }
              ]
            },
            "channelComparisonTable": [
              {
                "channelId": "11111111-1111-1111-1111-111111111111",
                "name": "Channel One",
                "totalMessages": 70,
                "errorPercentage": 70.0
              }
            ]
          }
  - name: 400 Bad Request - invalid metric (card-only value on dashboard endpoint)
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/?metric=filtered"
      method: GET
      params:
        - name: metric
          value: filtered
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "metric": [
              "\"filtered\" is not a valid choice."
            ]
          }
  - name: 400 Bad Request - time_frame=custom missing start_date/end_date
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/?time_frame=custom"
      method: GET
      params:
        - name: time_frame
          value: custom
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "non_field_errors": [
              "start_date and end_date are required when time_frame=custom."
            ]
          }
  - name: 400 Bad Request - start_date/end_date sent without time_frame=custom
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/?time_frame=1w&start_date=2026-07-01T00:00:00Z&end_date=2026-07-15T00:00:00Z"
      method: GET
      params:
        - name: time_frame
          value: 1w
          type: query
        - name: start_date
          value: 2026-07-01T00:00:00Z
          type: query
        - name: end_date
          value: 2026-07-15T00:00:00Z
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "non_field_errors": [
              "start_date/end_date are only allowed when time_frame=custom."
            ]
          }

docs: "Reshaped dashboard payload: unified mainChart series for the selected metric (volume|error|queued|sent) + per-channel channelComparisonTable."
