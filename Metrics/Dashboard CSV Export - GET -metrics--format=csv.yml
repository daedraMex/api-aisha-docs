info:
  name: Dashboard CSV Export - GET /metrics/?format=csv
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/metrics/?time_frame=1w&metric=volume&format=csv"
  params:
    - name: time_frame
      value: 1w
      type: query
    - name: metric
      value: volume
      type: query
    - name: format
      value: csv
      type: query
    - name: channels
      value: ""
      type: query
      disabled: true
    - name: start_date
      value: ""
      type: query
      disabled: true
    - name: end_date
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - CSV (default time_frame=1w, metric=volume)
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/?time_frame=1w&metric=volume&format=csv"
      method: GET
      params:
        - name: time_frame
          value: 1w
          type: query
        - name: metric
          value: volume
          type: query
        - name: format
          value: csv
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/csv; charset=utf-8
        - name: Content-Disposition
          value: attachment; filename="dashboard_metrics.csv"
      body:
        type: text
        data: |
          # mainChart
          bucket,Volumen Total
          2026-07-14T00:00:00+00:00,120
          2026-07-15T00:00:00+00:00,98

          # channelComparisonTable
          channelId,name,totalMessages,errorPercentage
          11111111-1111-1111-1111-111111111111,Channel One,218,4.6
  - name: 400 Bad Request - CSV (invalid metric, same validation as JSON path)
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/?metric=filtered&format=csv"
      method: GET
      params:
        - name: metric
          value: filtered
          type: query
        - name: format
          value: csv
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: text/csv; charset=utf-8
      body:
        type: text
        data: |
          error
          "{'metric': ['\"filtered\" is not a valid choice.']}"

docs: "Same payload as 'Dashboard - GET /metrics/', selected via DRF content negotiation (?format=csv or Accept: text/csv). Returns a downloadable CSV (Content-Disposition: attachment) with two '# section' blocks: mainChart and channelComparisonTable. Channel names are quoted/defused against CSV formula injection. 4xx/5xx responses also negotiate to CSV and degrade to a minimal 'error' row instead of JSON."
