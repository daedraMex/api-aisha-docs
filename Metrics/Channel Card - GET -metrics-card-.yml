info:
  name: Channel Card - GET /metrics/card/
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/metrics/card/?channel_id={{channel_id}}&metric=all"
  params:
    - name: channel_id
      value: "{{channel_id}}"
      type: query
    - name: metric
      value: all
      type: query
    - name: start_date
      value: ""
      type: query
      disabled: true
    - name: end_date
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - default range (last 7 days)
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/card/?channel_id={{channel_id}}&metric=all"
      method: GET
      params:
        - name: channel_id
          value: "{{channel_id}}"
          type: query
        - name: metric
          value: all
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "channel_id": "11111111-1111-1111-1111-111111111111",
            "name": "Channel One",
            "is_active": true,
            "period": {
              "start": "2026-07-14T00:00:00+00:00",
              "end": "2026-07-21T00:00:00+00:00",
              "granularity": "day"
            },
            "summary": {
              "received": 200,
              "sent": 190,
              "error": 5,
              "filtered": 3,
              "error_rate": 2.5,
              "avg_per_bucket": 28.6
            },
            "series": [
              {
                "bucket": "2026-07-14T00:00:00+00:00",
                "received": 28,
                "sent": 27,
                "error": 1,
                "filtered": 0,
                "queued": 0
              }
            ]
          }
  - name: 400 Bad Request - missing channel_id
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/card/"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "channel_id": [
              "This field is required."
            ]
          }
  - name: 400 Bad Request - start_date after end_date
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/card/?channel_id={{channel_id}}&start_date=2026-07-15T00:00:00Z&end_date=2026-07-01T00:00:00Z"
      method: GET
      params:
        - name: channel_id
          value: "{{channel_id}}"
          type: query
        - name: start_date
          value: 2026-07-15T00:00:00Z
          type: query
        - name: end_date
          value: 2026-07-01T00:00:00Z
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "non_field_errors": [
              "start_date must be before or equal to end_date."
            ]
          }
  - name: 404 Not Found - channel has no captured snapshots (bonus, real behavior)
    request:
      url: "{{base_url}}/api/v1/integration-engine/metrics/card/?channel_id=99999999-9999-9999-9999-999999999999"
      method: GET
      params:
        - name: channel_id
          value: 99999999-9999-9999-9999-999999999999
          type: query
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "Channel not found."
          }

docs: "Single channel detail: summary + series for a custom (or default 7-day) date range."
