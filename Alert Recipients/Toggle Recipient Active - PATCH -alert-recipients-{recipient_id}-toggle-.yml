info:
  name: Toggle Recipient Active - PATCH /alert-recipients/{recipient_id}/toggle/
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{base_url}}/api/v1/integration-engine/alert-recipients/{{recipient_id}}/toggle/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - toggled to inactive
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-recipients/{{recipient_id}}/toggle/"
      method: PATCH
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "33333333-3333-3333-3333-333333333333",
            "name": "Jane Doe",
            "email": "jane.doe@example.com",
            "activo": false,
            "created_at": "2026-08-20T10:00:00Z",
            "updated_at": "2026-08-20T10:10:00Z"
          }
  - name: 404 Not Found - NOT_FOUND
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-recipients/does-not-exist/toggle/"
      method: PATCH
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ALERT_RECIPIENT.NOT_FOUND",
              "message": "Alert recipient not found.",
              "details": null
            }
          }
