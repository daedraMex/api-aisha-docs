info:
  name: List alert events - GET /alerts/
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/alerts/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - with data
    request:
      url: "{{base_url}}/api/v1/integration-engine/alerts/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "page": 1,
            "page_size": 20,
            "total": 2,
            "has_next": false,
            "has_previous": false,
            "data": [
              {
                "id": "2",
                "started_at": "2026-06-30T02:12:00+00:00",
                "severity": "CRITICAL",
                "channel_id": "11111111-1111-1111-1111-111111111111",
                "channel_name": "worklistSAAS",
                "message": "Sin conexión con el motor de integración",
                "status": "ACTIVE",
                "duration_seconds": null
              },
              {
                "id": "1",
                "started_at": "2026-06-29T04:03:00+00:00",
                "severity": "INFO",
                "channel_id": "22222222-2222-2222-2222-222222222222",
                "channel_name": "Optimi-Patologia",
                "message": "Reinicio programado del canal",
                "status": "RESOLVED",
                "duration_seconds": 300
              }
            ]
          }
  - name: 200 OK - empty
    request:
      url: "{{base_url}}/api/v1/integration-engine/alerts/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "page": 1,
            "page_size": 20,
            "total": 0,
            "has_next": false,
            "has_previous": false,
            "data": []
          }

docs: Returns every alert event across all channels/users, most recent (started_at) first.
