info:
  name: Filter by date range - GET /alerts/?start_date=...&end_date=...
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/alerts/?start_date=2026-06-29T00:00:00Z&end_date=2026-06-29T23:59:59Z"
  params:
    - name: start_date
      value: 2026-06-29T00:00:00Z
      type: query
    - name: end_date
      value: 2026-06-29T23:59:59Z
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - within range
    request:
      url: "{{base_url}}/api/v1/integration-engine/alerts/?start_date=2026-06-29T00:00:00Z&end_date=2026-06-29T23:59:59Z"
      method: GET
      params:
        - name: start_date
          value: 2026-06-29T00:00:00Z
          type: query
        - name: end_date
          value: 2026-06-29T23:59:59Z
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "page": 1,
            "page_size": 20,
            "total": 3,
            "has_next": false,
            "has_previous": false,
            "data": [
              {
                "id": "4",
                "started_at": "2026-06-29T12:30:00+00:00",
                "severity": "CRITICAL",
                "channel_id": "33333333-3333-3333-3333-333333333333",
                "channel_name": "MONITOR_CANAL",
                "message": "Fallo de conexión TCP con PACS",
                "status": "RESOLVED",
                "duration_seconds": 2880
              },
              {
                "id": "5",
                "started_at": "2026-06-29T08:10:00+00:00",
                "severity": "WARNING",
                "channel_id": "44444444-4444-4444-4444-444444444444",
                "channel_name": "ISH-Ordenes",
                "message": "Latencia de procesamiento elevada",
                "status": "RESOLVED",
                "duration_seconds": 4320
              },
              {
                "id": "3",
                "started_at": "2026-06-29T04:03:00+00:00",
                "severity": "INFO",
                "channel_id": "22222222-2222-2222-2222-222222222222",
                "channel_name": "Optimi-Patologia",
                "message": "Reinicio programado del canal",
                "status": "RESOLVED",
                "duration_seconds": 300
              }
            ]
          }
  - name: 400 Bad Request - start_date after end_date
    request:
      url: "{{base_url}}/api/v1/integration-engine/alerts/?start_date=2026-08-05T00:00:00Z&end_date=2026-08-01T00:00:00Z"
      method: GET
      params:
        - name: start_date
          value: 2026-08-05T00:00:00Z
          type: query
        - name: end_date
          value: 2026-08-01T00:00:00Z
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "non_field_errors": [
              "start_date must be before or equal to end_date."
            ]
          }

docs: start_date ("Desde") / end_date ("Hasta"), ISO 8601, filter on started_at. start_date must be <= end_date.
