info:
  name: List alert events - GET /alerts/ page>2
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/alerts/?page=1&page_size=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: page_size_query_param=page_size, max_page_size=100 (see AlertEventPagination).
