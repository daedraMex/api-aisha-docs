docs: No `destinations` yet -> persists as INCOMPLETE (200), resumable via GET. `queue_buffer_size`/`processing_threads` are intentionally omitted from `source.properties` to demonstrate their real defaults (1000/1) auto-filling from `MirthFieldDefinition.default_value`. `user_id` travels as a URL path segment, not in the body.
