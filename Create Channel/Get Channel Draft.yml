info:
  name: Get Channel Draft
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/{{draft_id}}/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/{{draft_id}}/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5b",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "HL7-Ingest-Sede-Norte",
              "source": [{"template_codigo": "channel-reader", "properties": {"respond_after_processing": true}}]
            },
            "xml_generated": null
          }
  - name: Error - 404 Not Found
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/{{draft_id}}/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "CHANNEL.NOT_FOUND",
              "message": "The specified draft does not exist.",
              "details": null
            }
          }

docs: Fetches a draft's current status/json_data/xml_generated so the frontend can resume editing.
