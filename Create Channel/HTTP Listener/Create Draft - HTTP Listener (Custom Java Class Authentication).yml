              "properties": {
                "url_servidor_auth": "https://auth.miempresa.com/v1"
              },
              "local_port": 8080
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

