      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "HTTP-Ingest-Custom-Auth",
        "description": "Canal HTTP Listener con Custom Java Class Authentication",
        "initial_state": "STARTED",
        "source": [
          {
            "template_codigo": "http-listener",
            "properties": {
              "auth_type": "CUSTOM",
