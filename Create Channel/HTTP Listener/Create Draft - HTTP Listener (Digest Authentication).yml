info:
  name: Create Draft - HTTP Listener (Digest Authentication)
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "HTTP-Ingest-Digest-Auth",
        "description": "Canal HTTP Listener con Digest Authentication",
        "initial_state": "STARTED",
        "source": [
          {
            "template_codigo": "http-listener",
            "properties": {
              "auth_type": "DIGEST",
              "realm": "Aisha Realm",
              "local_port": 8080
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK (INCOMPLETE)
    request:
      url: ""
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5c",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "HTTP-Ingest-Digest-Auth",
              "source": [
                {
                  "template_codigo": "http-listener",
                  "properties": {
                    "auth_type": "DIGEST",
                    "realm": "Aisha Realm",
                    "local_port": 8080
                  }
                }
              ]
            },
            "xml_generated": null
          }

docs: "auth_type=DIGEST: solo realm es payload-owned. algorithms (MD5_SESS, MD5), qopModes (AUTH, AUTH_INT) y opaque (${UUID}, directiva propia de Mirth) quedan fijos, no se envian ni se pueden sobreescribir via payload."
