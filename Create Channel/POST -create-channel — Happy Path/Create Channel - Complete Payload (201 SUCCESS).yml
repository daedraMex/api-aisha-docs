info:
  name: Create Channel - Complete Payload (201 SUCCESS)
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "My Channel",
        "description": "Integration test channel",
        "initial_state": "STARTED",
        "metaDataColumn": [
          {
            "name": "PATIENT_ID",
            "type": "STRING",
            "mappingName": "mirth_patient_id"
          }
        ],
        "source": [
          {
            "template_codigo": "channel-reader",
            "properties": {
              "respond_after_processing": true,
              "queue_buffer_size": 1000,
              "response_variable": "None",
              "process_batch": false,
              "first_response": false,
              "processing_threads": 1
            }
          }
        ],
        "destinations": [
          {
            "template_codigo": "file-dest",
            "properties": {
              "host": "ftp.example.com"
            }
          },
          {
            "template_codigo": "file-dest",
            "properties": {
              "host": "archive.example.com"
            }
          }
        ],
        "prune_metadata_days": 30,
        "prune_content_days": 60,
        "archive_enabled": true,
        "script": {
          "script_type": "DEPLOY",
          "script_content": "// PR10c integration test script\nreturn true;"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

