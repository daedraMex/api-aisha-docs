docs: "Full payload: base fields + 1 source connector (template_codigo=channel-reader) + 2 destination connectors (N destinations, template_codigo=file-dest each, payload order preserved) + 1 metaDataColumn entry + pruning settings + a complete `script` object (script_type/script_content nested). No draft_id -> creates a brand new draft and, since the payload is already complete, compiles + deploys in the same call. template_codigo values (channel-reader/file-dest) are the exact codes used by this repo's own integration test fixtures (test_create_channel_view.py), guaranteed to resolve against a seeded MirthTemplate."
