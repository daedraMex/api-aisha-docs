info:
  name: Validation Error - Source Cardinality
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "HL7-Ingest-Sede-Norte",
        "source": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Error - 400 Bad Request
    request:
      url: ""
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "source": ["Exactly one source connector is required, got 0."]
          }

docs: "`source` explicitly sent as an empty list (or 2+ entries) is a fail-fast structural error (400), never INCOMPLETE - it never reaches the pipeline. Omitting the `source` key entirely instead would be INCOMPLETE/200."
