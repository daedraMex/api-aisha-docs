info:
  name: Get fields - unknown codigo
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/plantillas/does-not-exist/fields/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 404 Not Found - CHANNEL.TEMPLATE_NOT_FOUND
    request:
      url: "{{base_url}}/api/v1/integration-engine/plantillas/does-not-exist/fields/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "CHANNEL.TEMPLATE_NOT_FOUND",
              "message": "No template found with codigo='does-not-exist'.",
              "details": null
            }
          }

docs: MirthTemplateRepository.get_by_codigo raises MirthTemplateNotFoundError when no template matches - left uncaught in GetMirthTemplateFieldsHandler and MirthTemplateFieldsView, so the global mirth_exception_handler maps it to 404 (same CHANNEL.TEMPLATE_NOT_FOUND code used by POST /create-channel for a bad source/destination template_codigo).
