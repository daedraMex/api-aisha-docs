docs: A structurally valid payload (passes fail-fast 400 checks) referencing a source template_codigo with no matching MirthTemplate row. MirthTemplateNotFoundError propagates uncaught from the handler to the global mirth_exception_handler (D8c) -- NOT caught inline in the view. No READY/SUCCESS is ever persisted for this draft.
