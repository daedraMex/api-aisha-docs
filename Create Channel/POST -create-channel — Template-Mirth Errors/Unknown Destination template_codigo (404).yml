info:
  name: Unknown Destination template_codigo (404)
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "My Channel",
        "description": "Integration test channel",
        "initial_state": "STARTED",
        "metaDataColumn": [
          {
            "name": "PATIENT_ID",
            "type": "STRING",
            "mappingName": "mirth_patient_id"
          }
        ],
        "source": [
          {
            "template_codigo": "channel-reader",
            "properties": {
              "respond_after_processing": true,
              "queue_buffer_size": 1000,
              "response_variable": "None",
              "process_batch": false,
              "first_response": false,
              "processing_threads": 1
            }
          }
        ],
        "destinations": [
          {
            "template_codigo": "does-not-exist",
            "properties": {}
          }
        ],
        "prune_metadata_days": 30,
        "prune_content_days": 60,
        "archive_enabled": true,
        "script": {
          "script_type": "DEPLOY",
          "script_content": "return true;"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 404 Not Found - unknown destination template, names code and stage
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "My Channel",
            "description": "Integration test channel",
            "initial_state": "STARTED",
            "metaDataColumn": [
              {
                "name": "PATIENT_ID",
                "type": "STRING",
                "mappingName": "mirth_patient_id"
              }
            ],
            "source": [
              {
                "template_codigo": "channel-reader",
                "properties": {
                  "respond_after_processing": true,
                  "queue_buffer_size": 1000,
                  "response_variable": "None",
                  "process_batch": false,
                  "first_response": false,
                  "processing_threads": 1
                }
              }
            ],
            "destinations": [
              {
                "template_codigo": "does-not-exist",
                "properties": {}
              }
            ],
            "prune_metadata_days": 30,
            "prune_content_days": 60,
            "archive_enabled": true,
            "script": {
              "script_type": "DEPLOY",
              "script_content": "return true;"
            }
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "CHANNEL.TEMPLATE_NOT_FOUND",
              "message": "No template found with code='does-not-exist'. (stage: destination)",
              "details": null
            }
          }

docs: Same missing-template handling as the source case, but for a destination entry -- the error names the destination stage explicitly.
