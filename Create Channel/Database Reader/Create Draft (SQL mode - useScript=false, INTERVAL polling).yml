docs: "`template_codigo='database-reader'` (migration 0040). `use_script=false` -> `select`/`update` must be plain SQL ANSI (validated server-side per the useScript dependency rule), not JavaScript. `polling_type`/`polling_frequency`/`poll_on_start`/`queue_buffer_size`/`processing_threads`/`cache_results`/`keep_connection_open`/`retry_count`/`retry_interval`/`fetch_size`/`encoding` are intentionally omitted from `properties` to demonstrate their `MirthFieldDefinition.default_value` auto-filling: polling_type=INTERVAL, polling_frequency=5000, poll_on_start=false, queue_buffer_size=1000, processing_threads=1, cache_results=true, keep_connection_open=true, retry_count=3, retry_interval=10000, fetch_size=1000, encoding=DEFAULT_ENCODING."
