docs: "Reference example: all 26 `MirthFieldDefinition` json_keys for `database-reader` (migration 0040) sent explicitly, so the frontend has a complete catalogue of every possible key/value shape in one place (no discovery endpoint exists yet - GET /plantillas/{id}/ returns xml_content but not field_definitions). Values shown are illustrative, not necessarily the defaults - e.g. `retry_count`/`fetch_size` deliberately differ from their default_value (3/1000) to show they're editable. `pollConnectorPropertiesAdvanced` (weekly schedule, inactive days, day-of-month, time range) is NOT in this list because it has no field definition - it always ships with the template's fixed literal defaults, out of scope of the UI reference matrix this connector was built from."
