info:
  name: Create Draft - HTTP Listener (Basic Authentication)
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "HTTP-Ingest-Basic-Auth",
        "description": "Canal HTTP Listener con Basic Authentication",
        "initial_state": "STARTED",
        "source": [
          {
            "template_codigo": "http-listener",
            "properties": {
              "auth_type": "BASIC",
              "realm": "Aisha Realm",
              "credentials": {
                "integracion": "s3cr3t-pass"
              },
              "local_port": 8080,
              "context_path": "/v1/pacientes"
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK (INCOMPLETE)
    request:
      url: ""
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5c",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "HTTP-Ingest-Basic-Auth",
              "source": [
                {
                  "template_codigo": "http-listener",
                  "properties": {
                    "auth_type": "BASIC",
                    "realm": "Aisha Realm",
                    "credentials": {
                      "integracion": "s3cr3t-pass"
                    },
                    "local_port": 8080,
                    "context_path": "/v1/pacientes"
                  }
                }
              ]
            },
            "xml_generated": null
          }

docs: "auth_type=BASIC: realm y credentials (mapa username->password, uno o varios pares) son owned por bind_http_listener_source y se inyectan dentro de BasicHttpAuthProperties/credentials como entries de un linked-hash-map. isUseCredentialsVariable/credentialsVariable quedan boilerplate fijo (false / vacio)."
