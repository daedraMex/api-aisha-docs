info:
  name: Create Draft - JavaScript Reader with default properties
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "js-reader-demo",
        "description": "Polls every 5s and emits a JSON status payload",
        "initial_state": "STARTED",
        "metaDataColumn": [
          { "name": "ESTADO", "type": "STRING" }
        ],
        "source": [
          {
            "template_codigo": "javascript-reader",
            "properties": {
              "polling_type": "INTERVAL",
              "poll_on_start": false,
              "polling_frequency": 5000,
              "respond_after_processing": true,
              "process_batch": false,
              "first_response": false,
              "processing_threads": 1,
              "queue_buffer_size": 1000,
              "response_variable": "None",
              "script": "return JSON.stringify({\"status\": \"ok\"});"
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - INCOMPLETE (destinations still missing)
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "33333333-3333-3333-3333-333333333333",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "js-reader-demo",
              "description": "Polls every 5s and emits a JSON status payload",
              "initial_state": "STARTED",
              "metadata_columns": [
                { "name": "ESTADO", "type": "STRING", "mappingName": null }
              ],
              "source": [
                {
                  "template_codigo": "javascript-reader",
                  "properties": {
                    "polling_type": "INTERVAL",
                    "poll_on_start": false,
                    "polling_frequency": 5000,
                    "respond_after_processing": true,
                    "process_batch": false,
                    "first_response": false,
                    "processing_threads": 1,
                    "queue_buffer_size": 1000,
                    "response_variable": "None",
                    "script": "return JSON.stringify({\"status\": \"ok\"});"
                  }
                }
              ],
              "destinations": []
            },
            "xml_generated": null
          }

docs: No draft_id -> creates a new draft. destinations is omitted (no DESTINATION_CONNECTOR template seeded yet), so the handler persists INCOMPLETE instead of compiling/deploying - this is the real, current resting state for any javascript-reader draft on this branch.
