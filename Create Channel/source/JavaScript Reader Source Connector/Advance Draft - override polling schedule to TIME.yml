info:
  name: Advance Draft - override polling schedule to TIME
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "draft_id": "{{draft_id}}",
        "name": "js-reader-demo",
        "source": [
          {
            "template_codigo": "javascript-reader",
            "properties": {
              "polling_type": "TIME",
              "polling_hour": 6,
              "polling_minute": 30,
              "poll_on_start": true,
              "script": "return JSON.stringify({\"status\": \"ok\", \"generatedAt\": DateUtil.getCurrentDate(\"yyyy-MM-dd'T'HH:mm:ss\")});"
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - INCOMPLETE (schedule overridden, destinations still missing)
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "33333333-3333-3333-3333-333333333333",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "js-reader-demo",
              "description": null,
              "initial_state": null,
              "metadata_columns": [],
              "source": [
                {
                  "template_codigo": "javascript-reader",
                  "properties": {
                    "polling_type": "TIME",
                    "polling_hour": 6,
                    "polling_minute": 30,
                    "poll_on_start": true,
                    "script": "return JSON.stringify({\"status\": \"ok\", \"generatedAt\": DateUtil.getCurrentDate(\"yyyy-MM-dd'T'HH:mm:ss\")});"
                  }
                }
              ],
              "destinations": []
            },
            "xml_generated": null
          }

docs: "Same draft_id as the previous request. Only polling_type/polling_hour/polling_minute/poll_on_start/script are sent - every other javascript-reader field (queue_buffer_size, processing_threads, etc.) falls back to its MirthFieldDefinition.default_value via bind_connector_properties, since properties are re-bound from scratch on each call, not merged with the previous submission. Still INCOMPLETE: destinations remains empty."
