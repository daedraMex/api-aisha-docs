info:
  name: Advance Draft - custom port, MLLPv2, higher connection limit
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "draft_id": "{{draft_id}}",
        "name": "tcp-listener-demo",
        "source": [
          {
            "template_codigo": "tcp-listener",
            "properties": {
              "port": 6663,
              "use_mllpv2": true,
              "max_connections": 25,
              "receive_timeout": 30000
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - INCOMPLETE (overrides applied, destinations still missing)
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "44444444-4444-4444-4444-444444444444",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "tcp-listener-demo",
              "description": null,
              "initial_state": null,
              "metadata_columns": [],
              "source": [
                {
                  "template_codigo": "tcp-listener",
                  "properties": {
                    "port": 6663,
                    "use_mllpv2": true,
                    "max_connections": 25,
                    "receive_timeout": 30000
                  }
                }
              ],
              "destinations": []
            },
            "xml_generated": null
          }

docs: "Same draft_id as the previous request. Only port/use_mllpv2/max_connections/receive_timeout are sent - every other tcp-listener field (host, queue_buffer_size, start_of_message_bytes, etc.) falls back to its MirthFieldDefinition.default_value via bind_connector_properties, since properties are re-bound from scratch on each call, not merged with the previous submission. Still INCOMPLETE: destinations remains empty. Stays in MLLP/server mode - switching transmissionModeProperties to Basic or server_mode to client is not achievable through this generic binder (see collection description)."
