docs: "No draft_id -> creates a new draft. destinations is omitted (no DESTINATION_CONNECTOR template seeded yet), so the handler persists INCOMPLETE instead of compiling/deploying - this is the real, current resting state for any tcp-listener draft on this branch. All 20 properties match tcp-listener's MirthFieldDefinition.default_value exactly (migration 0050) - sending an empty properties: {} would produce the identical compiled XML via fallback."
