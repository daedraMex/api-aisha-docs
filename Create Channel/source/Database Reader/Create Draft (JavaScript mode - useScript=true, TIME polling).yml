        data: |-
          {
            "id": "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "Reporte-Pacientes-JS",
              "source": [{"template_codigo": "database-reader", "properties": {"polling_type": "TIME", "use_script": true}}]
            },
            "xml_generated": null
          }

docs: "`use_script=true` -> `select`/`update` must be Mirth JavaScript with the try/finally + DatabaseConnectionFactory structure. IMPORTANT (audited against 11 real Mirth exports): the JS text hardcodes driver/url/username/password a SECOND time as literal string args to `createDatabaseConnection(...)`, duplicating the top-level fields above. `bind_connector_properties` binds exactly one XML node per key (lxml, not string substitution), so it can NEVER sync that embedded copy - if you change driver/url/username/password later, you must manually re-send an updated `select`/`update` too. This matches real Mirth Administrator UX: the auto-generated script is one-time boilerplate the user hand-edits, never re-synced by Mirth itself either."
