info:
  name: Create Draft - File Reader (FTP scheme)
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "HL7-Ingest-FTP-Externo",
        "description": "Canal de ingesta HL7 leyendo desde un servidor FTP externo",
        "initial_state": "STARTED",
        "source": [
          {
            "template_codigo": "file-reader",
            "properties": {
              "scheme": "FTP",
              "host": "ftp.tuservidor.com",
              "port": 21,
              "anonymous": false,
              "username": "admin",
              "password": "secreto",
              "afterProcessingAction": "MOVE",
              "moveToDirectory": "/procesados",
              "moveToFileName": "${originalFilename}",
              "errorReadingAction": "NONE",
              "charsetEncoding": "UTF-8"
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK (INCOMPLETE)
    request:
      url: ""
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5b",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "HL7-Ingest-FTP-Externo",
              "source": [{"template_codigo": "file-reader", "properties": {"scheme": "FTP", "host": "ftp.tuservidor.com", "port": 21}}]
            },
            "xml_generated": null
          }

docs: "FTP scheme: `<host>` is derived as `f\"{host}/{port}\"` (`ftp.tuservidor.com/21`). `anonymous: false` means `username`/`password` pass through verbatim - set `anonymous: true` instead to force both to `\"anonymous\"` and ignore whatever is submitted. `afterProcessingAction: MOVE` here (unlike the FILE example) so `moveToDirectory`/`moveToFileName` actually get written - both are forced back to empty text if the action isn't MOVE. Injects `<schemeProperties class=\"...FTPSchemeProperties\">` automatically. No `destinations` yet -> INCOMPLETE (200)."
