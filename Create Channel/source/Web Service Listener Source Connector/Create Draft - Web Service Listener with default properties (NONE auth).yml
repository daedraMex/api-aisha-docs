info:
  name: Create Draft - Web Service Listener with default properties (NONE auth)
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "ws-listener-demo",
        "description": "SOAP endpoint on 0.0.0.0:8081, no authentication",
        "initial_state": "STARTED",
        "metaDataColumn": [
          { "name": "REMOTE_IP", "type": "STRING" }
        ],
        "source": [
          {
            "template_codigo": "web-service-listener",
            "properties": {
              "host": "0.0.0.0",
              "port": 8081,
              "response_variable": "None",
              "respond_after_processing": true,
              "process_batch": false,
              "first_response": false,
              "processing_threads": 1,
              "queue_buffer_size": 1000,
              "class_name": "com.mirth.connect.connectors.ws.DefaultAcceptMessage",
              "service_name": "Mirth",
              "soap_binding": "DEFAULT"
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - INCOMPLETE (destinations still missing)
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "55555555-5555-5555-5555-555555555555",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "ws-listener-demo",
              "description": "SOAP endpoint on 0.0.0.0:8081, no authentication",
              "initial_state": "STARTED",
              "metadata_columns": [
                { "name": "REMOTE_IP", "type": "STRING", "mappingName": null }
              ],
              "source": [
                {
                  "template_codigo": "web-service-listener",
                  "properties": {
                    "host": "0.0.0.0",
                    "port": 8081,
                    "response_variable": "None",
                    "respond_after_processing": true,
                    "process_batch": false,
                    "first_response": false,
                    "processing_threads": 1,
                    "queue_buffer_size": 1000,
                    "class_name": "com.mirth.connect.connectors.ws.DefaultAcceptMessage",
                    "service_name": "Mirth",
                    "soap_binding": "DEFAULT"
                  }
                }
              ],
              "destinations": []
            },
            "xml_generated": null
          }

docs: "No draft_id -> creates a new draft. destinations is omitted (no DESTINATION_CONNECTOR template seeded yet), so the handler persists INCOMPLETE instead of compiling/deploying - this is the real, current resting state for any web-service-listener draft on this branch. All 11 properties match web-service-listener's MirthFieldDefinition.default_value exactly (migration 0051) - sending an empty properties: {} would produce the identical compiled XML via fallback. Auth stays NONE regardless of payload (see collection description)."
