info:
  name: Fetch Draft
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/{{draft_id}}/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/{{draft_id}}/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "55555555-5555-5555-5555-555555555555",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "ws-listener-demo",
              "description": null,
              "initial_state": null,
              "metadata_columns": [],
              "source": [
                {
                  "template_codigo": "web-service-listener",
                  "properties": {
                    "port": 8082,
                    "service_name": "AdmissionsService",
                    "soap_binding": "SOAP12HTTP",
                    "queue_buffer_size": 2000
                  }
                }
              ],
              "destinations": []
            },
            "xml_generated": null
          }
  - name: 404 Not Found - draft does not belong to user / does not exist
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/99999999-9999-9999-9999-999999999999/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "CHANNEL.NOT_FOUND",
              "message": "The specified draft does not exist.",
              "details": null
            }
          }

docs: Returns the draft's current status, json_data, and xml_generated (null until the payload is complete enough to compile).
