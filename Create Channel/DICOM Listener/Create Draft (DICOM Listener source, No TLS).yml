info:
  name: Create Draft (DICOM Listener source, No TLS)
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "DICOM-Ingest-Sede-Norte",
        "description": "Canal de recepción DICOM para Sede Norte",
        "initial_state": "STARTED",
        "metaDataColumn": [
          { "name": "STUDY_UID", "type": "STRING", "mappingName": "study_instance_uid" }
        ],
        "source": [
          {
            "template_codigo": "dicom-listener",
            "properties": {
              "local_address": "0.0.0.0",
              "local_port": 104,
              "application_entity": "AISHA_PACS",
              "respond_after_processing": true,
              "response_variable": "None"
            }
          }
        ],
        "prune_metadata_days": 30,
        "prune_content_days": 60,
        "archive_enabled": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK (INCOMPLETE)
    request:
      url: ""
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "f2a3b4c5-d6e7-4f8a-9b0c-1d2e3f4a5b6c",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "DICOM-Ingest-Sede-Norte",
              "description": "Canal de recepción DICOM para Sede Norte",
              "initial_state": "STARTED",
              "source": [{"template_codigo": "dicom-listener", "properties": {"local_address": "0.0.0.0", "local_port": 104, "application_entity": "AISHA_PACS"}}]
            },
            "xml_generated": null
          }

docs: "`template_codigo='dicom-listener'` (migration 0039). `respond_after_processing` (Source Queue) IS set explicitly. Every OTHER DICOM-specific field not listed here - including `queue_buffer_size` (Queue Buffer Size) - is intentionally omitted from `source.properties` to demonstrate its `MirthFieldDefinition.default_value` auto-filling: queue_buffer_size=1000, dimse_rsp_interval(reaper)=10, a_release_rp_timeout(releaseTo)=5, associate_rq_timeout(requestTo)=5, dimse_rq_timeout(idleTo)=60, dimse_rsp_delay(rspDelay)=0, p_data_tf_sent(sndpdulen)=16, p_data_tf_received(rcvpdulen)=16, send_socket_buffer(sosndbuf)=0, receive_socket_buffer(sorcvbuf)=0, transcoder_buffer_size(bufSize)=1, pack_pdv(pdv1)=false, accept_explicit_vr(bigEndian)=false, only_accept_default(defts)=false, only_uncompressed(nativeData)=false, tcp_delay(tcpDelay)=true, tls=notls, client_authentication(noClientAuth)=true. Since `tls` defaults to `notls`, the certificate fields (see the TLS AES example below) are left empty here on purpose. IMPORTANT: this pipeline is snapshot-based, not a partial PATCH - every submit (including 'Advance Draft') must resend the FULL `properties` object for the connector, or any previously-set field not resent will silently revert to its default_value on recompilation (see engram topic ms-integration-engine/mirth-templates)."
