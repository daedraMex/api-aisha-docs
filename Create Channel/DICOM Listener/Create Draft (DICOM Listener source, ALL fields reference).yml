      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "DICOM-Ingest-Sede-Norte-Full",
        "description": "Canal de recepción DICOM para Sede Norte (todos los campos)",
        "initial_state": "STOPPED",
        "metaDataColumn": [
