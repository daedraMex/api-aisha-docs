docs: "Reference example: all 32 `MirthFieldDefinition` json_keys for `dicom-listener` (migration 0039) sent explicitly, so the frontend has a complete catalogue of every possible key/value shape in one place (no discovery endpoint exists yet - see engram topic ms-integration-engine/mirth-templates). Values shown are illustrative, not necessarily the defaults - e.g. `queue_buffer_size`/`processing_threads` deliberately differ from their `default_value` (1000/1) to show they're editable. `tls` is `notls` here so the 5 certificate fields are empty by convention; see the 'TLS AES + client cert' request for the non-empty case."
