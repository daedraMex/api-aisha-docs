info:
  name: Invalid metaDataColumn Type (400)
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "My Channel",
        "description": "Integration test channel",
        "initial_state": "STARTED",
        "metaDataColumn": [ { "name": "X", "type": "NOT_A_TYPE" } ],
        "source": [ { "template_codigo": "channel-reader", "properties": {} } ],
        "destinations": [ { "template_codigo": "file-dest", "properties": { "host": "ftp.example.com" } } ],
        "prune_metadata_days": 30,
        "prune_content_days": 60,
        "archive_enabled": true,
        "script_type": "DEPLOY",
        "script_content": "// PR10c integration test script\nreturn true;"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 400 Bad Request - invalid metaDataColumn.type
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "My Channel",
            "description": "Integration test channel",
            "initial_state": "STARTED",
            "metaDataColumn": [ { "name": "X", "type": "NOT_A_TYPE" } ],
            "source": [ { "template_codigo": "channel-reader", "properties": {} } ],
            "destinations": [ { "template_codigo": "file-dest", "properties": { "host": "ftp.example.com" } } ],
            "prune_metadata_days": 30,
            "prune_content_days": 60,
            "archive_enabled": true,
            "script_type": "DEPLOY",
            "script_content": "// PR10c integration test script\nreturn true;"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "metaDataColumn": [
              {
                "type": [
                  "\"NOT_A_TYPE\" is not a valid choice."
                ]
              }
            ]
          }

docs: metaDataColumn[].type must be one of STRING/NUMBER/BOOLEAN/TIMESTAMP. An out-of-enum value fails fast with 400, naming the invalid value, before the pipeline runs.
