examples:
  - name: 400 Bad Request - script.script_content required
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "My Channel No Script Content",
            "description": "Integration test channel",
            "initial_state": "STARTED",
            "metaDataColumn": [ { "name": "PATIENT_ID", "type": "STRING", "mappingName": "mirth_patient_id" } ],
            "source": [ { "template_codigo": "channel-reader", "properties": { "respond_after_processing": true, "queue_buffer_size": 1000, "response_variable": "None", "process_batch": false, "first_response": false, "processing_threads": 1 } } ],
            "destinations": [ { "template_codigo": "file-dest", "properties": { "host": "ftp.example.com" } } ],
            "prune_metadata_days": 30,
            "prune_content_days": 60,
            "archive_enabled": true,
            "script": {
              "script_type": "DEPLOY"
            }
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "script": {
              "script_content": [
                "This field is required."
              ]
            }
          }

docs: The `script` object is present but its inner `script_content` key is absent. Unlike the old flat wire shape (where this used to be a business-gap INCOMPLETE), `ScriptEntrySerializer.script_content` is `required=True` WITHIN the nested object - only the OUTER `script` key is optional/nullable. DRF rejects an incomplete-but-present `script` object as structurally invalid (400) before the view/handler ever runs.
