docs: "The `script` key omitted entirely (as opposed to present-but-incomplete, which is a 400 - see 'script Present but Missing script_content' below). This is a business gap sharing the same INCOMPLETE-gate condition as missing source/destinations (D9c) -- not a fail-fast error. Sending `script: null` explicitly produces the identical result (the outer field is `allow_null=True`)."
