info:
  name: Script Type PREPROCESSOR (201 SUCCESS)
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "My Channel Preprocessor",
        "description": "Integration test channel",
        "initial_state": "STARTED",
        "metaDataColumn": [ { "name": "PATIENT_ID", "type": "STRING", "mappingName": "mirth_patient_id" } ],
        "source": [ { "template_codigo": "channel-reader", "properties": { "respond_after_processing": true, "queue_buffer_size": 1000, "response_variable": "None", "process_batch": false, "first_response": false, "processing_threads": 1 } } ],
        "destinations": [ { "template_codigo": "file-dest", "properties": { "host": "ftp.example.com" } } ],
        "prune_metadata_days": 30,
        "prune_content_days": 60,
        "archive_enabled": true,
        "script": {
          "script_type": "PREPROCESSOR",
          "script_content": "// custom preprocessing\nreturn message;"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Created - preprocessingScript bound, other 3 tags at stock defaults
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "My Channel Preprocessor",
            "description": "Integration test channel",
            "initial_state": "STARTED",
            "metaDataColumn": [ { "name": "PATIENT_ID", "type": "STRING", "mappingName": "mirth_patient_id" } ],
            "source": [ { "template_codigo": "channel-reader", "properties": { "respond_after_processing": true, "queue_buffer_size": 1000, "response_variable": "None", "process_batch": false, "first_response": false, "processing_threads": 1 } } ],
            "destinations": [ { "template_codigo": "file-dest", "properties": { "host": "ftp.example.com" } } ],
            "prune_metadata_days": 30,
            "prune_content_days": 60,
            "archive_enabled": true,
            "script": {
              "script_type": "PREPROCESSOR",
              "script_content": "// custom preprocessing\nreturn message;"
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "88888888-8888-8888-8888-888888888888",
            "status": "SUCCESS",
            "json_data": { "script_type": "PREPROCESSOR", "script_content": "// custom preprocessing\nreturn message;" },
            "xml_generated": "<channel>...<preprocessingScript>// custom preprocessing\nreturn message;</preprocessingScript>...(deployScript/undeployScript/postprocessingScript reset to their own stock defaults)...</channel>"
          }

docs: script_type=PREPROCESSOR binds script_content into <preprocessingScript>; the other 3 tags fall back to their own stock defaults.
