info:
  name: Advance Draft (add destination) - 404 until a real destination template exists
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "draft_id": "{{draft_id}}",
        "name": "HL7-Ingest-Sede-Norte",
        "source": [
          {
            "template_codigo": "channel-reader",
            "properties": { "respond_after_processing": true }
          }
        ],
        "destinations": [
          {
            "template_codigo": "file-writer-sftp",
            "properties": { "host": "sftp.example.com" }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Error - 404 Not Found (no destination templates seeded yet)
    request:
      url: ""
      method: POST
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "CHANNEL.TEMPLATE_NOT_FOUND",
              "message": "No template found with codigo='file-writer-sftp'.",
              "details": null
            }
          }

docs: Same endpoint as create, but with `draft_id` set - advances an existing draft instead of creating a new one. `file-writer-sftp` is a PLACEHOLDER codigo - no destination connector template is seeded yet, so this currently 404s. Update this request once a real destination PR lands.
