info:
  name: Get Draft - GET /create-channel/{draft_id}/
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/{{draft_id}}/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - INCOMPLETE draft
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/{{draft_id}}/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "44444444-4444-4444-4444-444444444444",
            "status": "INCOMPLETE",
            "json_data": {
              "name": "My Channel",
              "description": "Integration test channel",
              "initial_state": "STARTED",
              "metadata_columns": [ { "name": "PATIENT_ID", "type": "STRING", "mappingName": "mirth_patient_id" } ],
              "source": { "template_codigo": "channel-reader", "properties": { "respond_after_processing": true, "queue_buffer_size": 1000, "response_variable": "None", "process_batch": false, "first_response": false, "processing_threads": 1 } },
              "destinations": [],
              "script_type": "DEPLOY",
              "script_content": "// PR10c integration test script\nreturn true;"
            },
            "xml_generated": null
          }
  - name: 404 Not Found - draft does not exist
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/create-channel/99999999-9999-9999-9999-999999999999/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "CHANNEL.NOT_FOUND",
              "message": "The specified draft does not exist.",
              "details": null
            }
          }

docs: Returns the draft's current status/json_data/xml_generated, regardless of lifecycle stage (DRAFT/INCOMPLETE/READY/PROCESSING/SUCCESS/ERROR). json_data and xml_generated may be null pre-compile.
