info:
  name: Template Detail
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/plantillas/{{template_id}}/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "a1b2c3d4-e5f6-4789-9abc-def012345678",
            "nombre": "Canal Base Pruning",
            "codigo": "canal-base-pruning",
            "tipo_componente": "CANAL_BASE",
            "xml_content": "<channel>...</channel>",
            "version_mirth": "4.4.2",
            "activo": true,
            "created_at": "2026-05-01T10:00:00Z",
            "updated_at": null
          }
  - name: Error - 404 Not Found
    request:
      url: ""
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "PLANTILLA.NOT_FOUND",
              "message": "No existe una plantilla con el ID proporcionado.",
              "details": null
            }
          }
