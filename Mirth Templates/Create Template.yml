      value: application/json
  body:
    type: json
    data: |-
      {
        "nombre": "Conector Source HL7",
        "codigo": "source-hl7-tcp",
        "tipo_componente": "SOURCE_CONNECTOR",
        "xml_content": "<sourceConnector>...</sourceConnector>",
        "version_mirth": "4.4.2"
      }
  auth: inherit

settings:
