    request:
      url: "{{base_url}}/api/v1/integration-engine/plantillas/"
      method: POST
      body:
        type: json
        data: |-
          {
            "nombre": "Conector Source HL7",
            "codigo": "source-hl7-tcp",
            "tipo_componente": "SOURCE_CONNECTOR",
            "xml_content": "<sourceConnector>...</sourceConnector>",
            "version_mirth": "4.4.2"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f",
