info:
  name: List User Channels
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/channels/"
  params:
    - name: is_favorite
      value: "true"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - 200 OK
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/channels/"
      method: GET
      params:
        - name: is_favorite
          value: "true"
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "page": 1,
            "page_size": 20,
            "total": 2,
            "has_next": false,
            "has_previous": false,
            "data": [
              {
                "id": "209ff7dd-27fe-483b-a322-a571c873f1bb",
                "channel_name": "DICOM-Ingest-Sede-Norte",
                "last_json_progress": {
                  "name": "DICOM-Ingest-Sede-Norte",
                  "source": {
                    "properties": {
                      "local_port": 104,
                      "local_address": "0.0.0.0",
                      "response_variable": "None",
                      "application_entity": "AISHA_PACS",
                      "respond_after_processing": true
                    },
                    "template_codigo": "dicom-listener"
                  },
                  "description": "Canal de recepción DICOM para Sede Norte",
                  "destinations": [],
                  "initial_state": "STARTED",
                  "metadata_columns": [
                    {
                      "name": "STUDY_UID",
                      "type": "STRING",
                      "mappingName": "study_instance_uid"
                    }
                  ]
                },
                "status": "INCOMPLETE",
                "is_favorite": false
              },
              {
                "id": "ac0416c6-17f7-4fff-87db-52938724e7d0",
                "channel_name": "HL7-Ingest-Sede-Norte",
                "last_json_progress": {
                  "name": "HL7-Ingest-Sede-Norte",
                  "source": {
                    "properties": {
                      "process_batch": false,
                      "first_response": false,
                      "response_variable": "None",
                      "respond_after_processing": true
                    },
                    "template_codigo": "channel-reader"
                  },
                  "description": "Canal de ingesta HL7 para Sede Norte",
                  "destinations": [],
                  "initial_state": "STARTED",
                  "metadata_columns": [
                    {
                      "name": "PATIENT_ID",
                      "type": "STRING",
                      "mappingName": "mirth_patient_id"
                    }
                  ]
                },
                "status": "INCOMPLETE",
                "is_favorite": false
              }
            ]
          }
  - name: Error - 400 Bad Request (invalid is_favorite)
    request:
      url: "{{base_url}}/api/v1/integration-engine/users/{{user_id}}/channels/"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "CHANNEL.VALIDATION_ERROR",
              "message": "Invalid is_favorite parameter. Use true or false.",
              "details": null
            }
          }

docs: Paginated list of the user's Mirth channel drafts/instances built through the wizard. `is_favorite` accepts true|false.
