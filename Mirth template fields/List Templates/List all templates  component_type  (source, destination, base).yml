info:
  name: List all templates  component_type  (source, destination, base)
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/templates/?component_type={{component_type}}"
  params:
    - name: component_type
      value: "{{component_type}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: component_type
      value: DESTINATION_CONNECTOR

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200 OK "
    request:
      url: "{{base_url}}/api/v1/integration-engine/templates?component_type=SOURCE_CONNECTOR"
      method: GET
      params:
        - name: component_type
          value: SOURCE_CONNECTOR
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "1a74ed9a-b2a7-46c4-a0b0-5d87ad671b65",
              "code": "web-service-listener",
              "component_type": "SOURCE_CONNECTOR",
              "is_active": true
            },
            {
              "id": "7e489228-a35d-491a-a844-6cb941876d38",
              "code": "tcp-listener",
              "component_type": "SOURCE_CONNECTOR",
              "is_active": true
            },
            {
              "id": "096d576d-775b-449d-aa6b-d94559e688d0",
              "code": "javascript-reader",
              "component_type": "SOURCE_CONNECTOR",
