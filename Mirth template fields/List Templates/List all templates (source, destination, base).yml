docs: "Returns EVERY stored template regardless of type - there is no ?component_type= query param, GetMirthTemplatesQuery takes no filters and the handler always calls repository.get_all(). To get only source connectors, only destination connectors, or the base channel, filter client-side on each item's component_type field: 'SOURCE_CONNECTOR', 'DESTINATION_CONNECTOR', or 'BASE_CHANNEL' (exact enum values, confirmed in presentation/api/plantillas/serializers.py). Use the 'code' of any SOURCE_CONNECTOR/DESTINATION_CONNECTOR entry as the template_codigo in POST /create-channel's source/destinations, and as the {code} path param in GET /templates/{code}/fields/ below to see its configurable fields."
