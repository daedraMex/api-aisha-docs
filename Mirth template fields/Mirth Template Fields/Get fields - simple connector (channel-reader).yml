info:
  name: Get fields - simple connector (channel-reader)
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/templates/channel-reader/fields/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    request:
      url: "{{base_url}}/api/v1/integration-engine/templates/channel-reader/fields/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "channel-reader",
            "name": "Channel Reader",
            "fields": [
              {
                "json_key": "respond_after_processing",
                "data_type": "bool",
                "is_required": true,
                "default_value": null
              },
              {
                "json_key": "queue_buffer_size",
                "data_type": "integer",
                "is_required": false,
                "default_value": "1000"
              },
              {
                "json_key": "response_variable",
                "data_type": "string",
                "is_required": true,
                "default_value": null
              },
              {
                "json_key": "process_batch",
                "data_type": "bool",
                "is_required": true,
                "default_value": null
              },
              {
                "json_key": "first_response",
                "data_type": "bool",
                "is_required": true,
                "default_value": null
              },
              {
                "json_key": "processing_threads",
                "data_type": "integer",
                "is_required": false,
                "default_value": "1"
              }
            ]
          }

docs: "Channel Reader (VM-based, push connector, no polling) has the smallest field set: only the standard sourceConnectorProperties block. respond_after_processing/response_variable/process_batch/first_response have no default_value (is_required=true, seeded in migration 0038) - the frontend must collect these from the user. queue_buffer_size/processing_threads are optional with concrete defaults."
