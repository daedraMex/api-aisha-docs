opencollection: 1.0.0

info:
  name: Aisha Integration Engine
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: base_url
      value: http://localhost:8011
    - name: channel_id
      value: 52863bfe-5653-425c-99cb-2643c6fd9884
    - name: message_id
      value: "9"
    - name: user_id
      value: 3f2e9b1a-6c4d-4a2f-9e21-7d8b5c1a9f30
    - name: feature
      value: canales
    - name: filter_id
      value: 9e73c186-ce07-4429-abe6-d8691d98bf7f
    - name: template_id
      value: ce08a9ce-1a8a-47c4-a7e5-b93b0a50fc6e
    - name: destination_id
      value: c7d8e9f0-1a2b-4c3d-8e9f-0a1b2c3d4e5f
    - name: draft_id
      value: e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5b

docs:
  content: ms-integration-engine — Mirth Connect bridge, channel management, saved filters and per-user channel instances. No authentication required (AllowAny on every endpoint). Organized by feature.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
