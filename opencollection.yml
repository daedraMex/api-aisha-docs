opencollection: 1.0.0

info:
  name: Aisha Integration Engine
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: base_url
      value: http://localhost:8011
    - name: channel_id
      value: 3947c4aa-dee8-4fa3-beb5-8382eb2e8e20
    - name: message_id
      value: "139231"
    - name: user_id
      value: 3f2e9b1a-6c4d-4a2f-9e21-7d8b5c1a9f30
    - name: feature
      value: canales
    - name: filter_id
      value: 9e73c186-ce07-4429-abe6-d8691d98bf7f
    - name: template_id
      value: 3db3ec38-45b6-4222-a99f-f681e6a347bd
    - name: destination_id
      value: 9ff0346e-1522-413b-8166-e3dfd1b3fca7
    - name: draft_id
      value: e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5b
    - name: revision
      value:
        type: number
        data: "5"

docs:
  content: ms-integration-engine — Mirth Connect bridge, channel management, saved filters and per-user channel instances. No authentication required (AllowAny on every endpoint). Organized by feature.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
