info:
  name: Update Alert Config (Partial) - PATCH /alert-config/
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{base_url}}/api/v1/integration-engine/alert-config/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "thresholds": {
          "ERROR_RATE": { "warning": 3, "critical": 5 }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - merged partially
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/"
      method: PATCH
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "monitoring_enabled": true,
            "monitor_config": {
              "environment": "PRODUCCION",
              "timezone": "America/Mexico_City",
              "monitor_frequency_seconds": 60,
              "alert_cooldown_minutes": 10,
              "tcp_timeout_ms": 2500
            },
            "thresholds": {
              "ERROR_RATE": { "warning": 3, "critical": 5 }
            }
          }
  - name: 400 Bad Request - VALIDATION_ERROR
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/"
      method: PATCH
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ALERT_CONFIG.VALIDATION_ERROR",
              "message": "Invalid request data.",
              "details": { "thresholds": ["At least one field is required."] }
            }
          }
  - name: 404 Not Found - NOT_FOUND
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/"
      method: PATCH
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ALERT_CONFIG.NOT_FOUND",
              "message": "Alert config is not initialized. Run bootstrap_default_alert.",
              "details": null
            }
          }

docs: "Partial merge — omitted fields keep their current value. Accepts any subset of monitor_config, thresholds, monitoring_enabled. At least one field is required. PUT on the same URL behaves identically (there is no full-replace variant for this singleton)."
