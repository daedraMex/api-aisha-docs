info:
  name: Get alert config - GET /alert-config/
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/integration-engine/alert-config/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK - full config
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "414c70dc-fdb4-4307-ab30-fa7e6d404dc1",
            "thresholds": {
              "QUEUE": { "warning": 100, "critical": 500, "blocked": 1000 },
              "ERROR_RATE": { "warning": 3, "critical": 5 },
              "BACKLOG_MINUTES": { "warning": 10, "critical": 30 },
              "JVM_MEMORY_PCT": { "warning": 80, "critical": 90 },
              "JVM_THREADS": { "warning": 250, "critical": 400 }
            },
            "channels": [
              { "channel_id": "11111111-1111-1111-1111-111111111111", "channel_name": "worklistSAAS", "active": false },
              { "channel_id": "22222222-2222-2222-2222-222222222222", "channel_name": "ISH-Ordenes", "active": true }
            ],
            "smtp_config": {
              "smtp_host": "smtp.ejemplo.com",
              "smtp_port": 587,
              "requires_authentication": false,
              "smtp_username": "",
              "sender_email": "remitente@ejemplo.com",
              "subject": "Alerta de sistema"
            },
            "recipients": [
              { "id": "r1", "name": "Victor", "email": "victor@empresa.com", "active": true },
              { "id": "r2", "name": "Radiologia", "email": "radio@empresa.com", "active": false }
            ]
          }
  - name: 404 Not Found - no alert configured
    request:
      url: "{{base_url}}/api/v1/integration-engine/alert-config/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "ALERT_CONFIG.NOT_FOUND",
              "message": "No alert configuration exists.",
              "details": null
            }
          }

docs: 'Returns the AishaAlert config (aggregate root): thresholds, channel toggles, SMTP config, and recipients — the 4 steps of the "Nueva alerta" wizard in one shot. No user_id scoping yet (not standardized across the service) — returns the first (oldest, by created_at) AishaAlert row found. thresholds is returned as raw JSON pass-through, not a fixed schema.'
